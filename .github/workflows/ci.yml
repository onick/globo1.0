name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Throwaway server: the shadow database checks that prisma/migrations matches the
      # schema, and globo_test runs the API tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Tenant isolation tests
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d shadow -c "CREATE DATABASE globo_test"
          npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/globo_test

      - name: Migrations match the schema
        run: npm run db:check
        env:
          SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow

      - name: Build
        run: npm run build
